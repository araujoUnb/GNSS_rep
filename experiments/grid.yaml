# Experiment grid for the DSP revision (complements the response letter).
# A *scenario* is the cartesian product of the `experiment` lists; each scenario
# runs `n_mc` Monte-Carlo realizations (seed = base_seed + mc_index) and maps to
# ONE SLURM array task via SLURM_ARRAY_TASK_ID. Run `python scenarios.py` to get
# the scenario count (= array size) and the index->scenario mapping.
#
# Faithful to the ORIGINAL paper code (simulator/DelayEstimation.py):
#   * calibration error  A = A_D + sqrt(eps/2) e^{j 2pi U}   (phasor model)
#   * refinement = GLOBAL L-BFGS-B (refine_span=None)
#   * post-correlation SNR from C/N0; mode-2 LS residual objective.

system:
  sat_id: 20
  bandwidth: 1023000.0         # B = 1.023 MHz -> N = 2046 (light)
  fc: 1575420000.0
  time_period: 0.001
  n_antennas: 8
  n_epochs: 30
  n_correlators: 11            # Q correlators
  delay_granularity: 11
  smr_db: 5.0

# Every entry below is a SWEEP axis (matches the original grid: angle_diff,
# delay_diff, C_N0, xi, epsilon). Trim the lists to control the scenario count.
experiment:
  cn0_db: [48.0]
  delta_tau_frac: [0.1, 0.3, 0.5, 0.7, 0.9]
  delta_phi_deg: [1.0, 2.0, 3.0, 5.0, 10.0]   # angular separation LOS/NLOS
  epsilon: [0.0, 0.001, 0.009, 0.05, 0.1, 0.2, 0.5]
  xi: [0.1]                                    # BO exploration (BO/BO+Ref only)
  estimators: ["LSKRF", "LSKRF+Ref", "BO", "BO+Ref"]
  base_seed: 20240101
  n_mc: 100
  checkpoint_every: 10

estimator_params:
  n_grid: 1024        # fine delay dictionary resolution
  bo_i_max: 50        # BO evaluation budget
  bo_n_init: 5        # BO initial random points

out_root: results
