[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-delay-sim"
version = "0.1.0"
description = "GNSS time-delay estimation Monte-Carlo simulator (uncalibrated arrays)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "tensorly",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "torch",                          # original simulator backend
    "bayesian-optimization==1.4.3",   # original BO engine (pinned API)
    # "botorch",                      # optional: GPU BO prototype (simulator/botorch_bo.py)
]

# The working simulator lives in simulator/ and runs via relative imports
# (not installed as a package); this project just pins the environment.
[tool.setuptools]
py-modules = []
